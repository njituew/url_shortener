<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <p class="wordmark">URL Shortener</p>
    <h1>Shorten your link</h1>
    <form id="urlForm">
      <input
        type="text"
        id="originalUrl"
        name="originalUrl"
        placeholder="https://..."
        required
        autocomplete="off"
      />
      <button type="submit">Shorten</button>
    </form>
    <div id="result" class="hidden">
      <span>→</span><a id="shortUrl" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div id="error" class="hidden"></div>
    <div class="divider"></div>
    <a href="saved_slugs.html" class="saved-link">Saved links →</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
