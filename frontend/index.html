<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>URL Shortener</h1>
    <form id="urlForm">
      <input
        type="text"
        id="originalUrl"
        name="originalUrl"
        placeholder="Вставьте URL..."
        required
        autocomplete="off"
      />
      <button type="submit">Сократить</button>
    </form>
    <div id="result" class="hidden">
      <p>Сокращённый URL: <a id="shortUrl" href="#" target="_blank" rel="noopener"></a></p>
    </div>
    <div id="error" class="hidden"></div>
    <div class="divider"></div>
    <a href="saved_slugs.html" class="saved-link">Сохранённые ссылки →</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
