<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saved Links — URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-slugs">

  <div class="slugs-layout">

    <header class="slugs-header">
      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>
      <h1 class="slugs-title">Saved Links</h1>
      <button id="deleteAllBtn" class="btn-danger-lg">Delete all</button>
    </header>

    <div id="loading" class="status-msg">
      <span class="spinner"></span> Loading...
    </div>
    <div id="emptyMsg" class="status-msg hidden">No saved links.</div>
    <div id="error" class="hidden error-msg"></div>

    <div id="tableWrap" class="table-wrap hidden">
      <table class="slug-table">
        <thead>
          <tr>
            <th class="col-index">#</th>
            <th class="col-short">Slug</th>
            <th class="col-original">Original URL</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="slugTableBody"></tbody>
      </table>
    </div>

  </div>

  <script src="saved_slugs.js"></script>
</body>
</html>
